<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>تۆمارکردنی فرۆشگا</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="bg-gray-100 flex items-center justify-center min-h-screen">
    <div class="bg-white p-8 rounded-xl shadow-md w-full max-w-lg my-6">
        <h2 class="text-2xl font-bold text-center text-blue-900 mb-6">تۆمارکردنی فرۆشگا / پێشانگا</h2>
        <form method="POST" class="space-y-4">
            <div class="grid grid-cols-2 gap-4">
                <div>
                    <label class="block text-gray-700 mb-1 text-sm">ناوی بەکارهێنەر (بۆ لۆگین)</label>
                    <input type="text" name="username" required class="w-full border rounded-lg p-2.5 outline-none text-sm">
                </div>
                <div>
                    <label class="block text-gray-700 mb-1 text-sm">وشەی تێپەڕ</label>
                    <input type="password" name="password" required class="w-full border rounded-lg p-2.5 outline-none text-sm">
                </div>
            </div>
            <div>
                <label class="block text-gray-700 mb-1 text-sm">ناوی فرۆشگا / پێشانگا</label>
                <input type="text" name="name" required class="w-full border rounded-lg p-2.5 outline-none text-sm">
            </div>
            <div class="grid grid-cols-2 gap-4">
                <div>
                    <label class="block text-gray-700 mb-1 text-sm">ژمارەی پەیوەندی</label>
                    <input type="text" name="phone" class="w-full border rounded-lg p-2.5 outline-none text-sm">
                </div>
                <div>
                    <label class="block text-gray-700 mb-1 text-sm">ئیمەیڵ</label>
                    <input type="email" name="email" class="w-full border rounded-lg p-2.5 outline-none text-sm">
                </div>
            </div>
            <div>
                <label class="block text-gray-700 mb-1 text-sm">پۆلێن (Category)</label>
                <select name="category" class="w-full border rounded-lg p-2.5 outline-none text-sm">
                    <option value="ئەلکترۆنیات">ئەلکترۆنیات</option>
                    <option value="کارەباییات">کارەباییات</option>
                    <option value="بیناسازی">بیناسازی</option>
                    <option value="کەلوپەل">کەلوپەل</option>
                </select>
            </div>
            <button type="submit" class="w-full bg-emerald-600 text-white py-3 rounded-lg font-bold hover:bg-emerald-700 transition">تۆمارکردن</button>
        </form>
        <div class="text-center mt-4">
            <a href="{{ url_for('login') }}" class="text-sm text-blue-600 hover:underline">چوونە ژوورەوە</a>
        </div>
    </div>
</body>
</html>
